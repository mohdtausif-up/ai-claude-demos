expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL
memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 12M
max_file_uploads = 10
date.timezone = UTC
session.use_strict_mode = 1
session.use_only_cookies = 1
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 1
