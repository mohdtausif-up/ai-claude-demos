server {
    listen 80 default_server;
    server_name _;
    root /var/www/public;
    index index.php;

    client_max_body_size 30m;
    server_tokens off;

    # Resolve the PHP container through Docker DNS at request time, so recreating it never
    # leaves nginx pointing at a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    # Never serve dotfiles or anything outside /public.
    location ~ /\. { deny all; }

    location /assets/ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
        fastcgi_request_buffering off;
    }

    # Any other .php file is never executed.
    location ~ \.php$ { return 404; }
}
